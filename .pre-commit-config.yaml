# Install once: `pipx install pre-commit && pre-commit install`
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint (generated-types rule)
        entry: bash -c 'cd frontend && npx eslint --max-warnings 0 .'
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: api-contract
        name: OpenAPI contract up to date
        entry: make contract
        language: system
        files: ^(backend/app/|openapi/|frontend/src/api/generated/)
        pass_filenames: false
