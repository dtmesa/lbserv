# DigitalOcean App Platform spec.
#   Create:  doctl apps create --spec .do/app.yaml
#   Update:  doctl apps update <app-id> --spec .do/app.yaml
# Set real values for SECRET envs in the control panel (or via doctl) after the first create.
name: lbserv
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  # Managed PostgreSQL 16 cluster (1 GiB node, 22 backend connections), created separately:
  #   doctl databases create lbserv-pg --engine pg --version 16 --region nyc3 \
  #     --size db-s-1vcpu-1gb --num-nodes 1
  #   doctl databases db create <cluster-id> lbserv
  - name: pg
    engine: PG
    version: "16"
    production: true
    cluster_name: lbserv-pg
    db_name: lbserv

services:
  - name: api
    github:
      repo: dtmesa/lbserv
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${pg.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${pg.CA_CERT}
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: set-in-control-panel
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "[]"
      - key: PROBLEM_TYPE_BASE
        scope: RUN_TIME
        value: ${APP_URL}/problems/
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
      # 2 workers x (1 LISTEN + 2 pooled + 2 overflow) = 10 per instance; <= 21 during deploys.
      - key: WEB_CONCURRENCY
        scope: RUN_TIME
        value: "2"
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "2"
      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "2"
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        scope: RUN_TIME
        value: "0.1"

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: dtmesa/lbserv
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    run_command: alembic upgrade head
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${pg.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${pg.CA_CERT}

static_sites:
  - name: web
    github:
      repo: dtmesa/lbserv
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_SENTRY_DSN
        scope: BUILD_TIME
        value: ""
      - key: VITE_SENTRY_ENVIRONMENT
        scope: BUILD_TIME
        value: production
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        scope: BUILD_TIME
        value: "0.1"

# One origin: /api → FastAPI (prefix preserved), everything else → the static React app.
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web
